services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice_creation
    ports:
      - "5432:5432"
    volumes:
      - invoice_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_creation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invoice_pg:
