openapi: 3.1.0
info:
  title: Invoice Creation API
  version: 0.1.0
  description: Internal customer invoice drafts, submit, and PDF export.
servers:
  - url: /api
paths:
  /invoices:
    get:
      summary: List invoices
      responses:
        "200":
          description: Latest invoices
    post:
      summary: Create draft invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceWrite"
      responses:
        "201":
          description: Draft created
        "400":
          description: Validation or domain error
  /invoices/{id}:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    get:
      summary: Get invoice
      responses:
        "200":
          description: Invoice with line items
        "404":
          description: Not found
    patch:
      summary: Replace a draft invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceWrite"
      responses:
        "200":
          description: Updated draft
        "400":
          description: Not a draft or invalid payload
        "409":
          description: Stale version
  /invoices/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    post:
      summary: Submit draft (assigns number, freezes snapshot)
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
      responses:
        "200":
          description: Submitted invoice
  /invoices/{id}/pdf:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    get:
      summary: Download invoice PDF
      responses:
        "200":
          description: PDF bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
components:
  parameters:
    InvoiceId:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    InvoiceWrite:
      type: object
      required: [customerName, issueDate, taxRateBps, lines]
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
        billingAddress:
          type: string
        notes:
          type: string
        issueDate:
          type: string
          format: date
        currency:
          type: string
          default: ETB
        taxRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        version:
          type: integer
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, quantity, unitPrice]
            properties:
              description:
                type: string
              quantity:
                type: string
                description: Major-unit decimal, up to 3 places
              unitPrice:
                type: string
                description: Major-unit decimal in invoice currency
